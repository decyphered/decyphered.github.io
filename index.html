        <style>
            :root {
                color-scheme: dark;
                --page-pad: 24px;
                /* Overridden from JS with visualViewport height so the
                   on-screen keyboard doesn't cover the prompt. */
                --app-height: 100svh;
                --terminal-bg: #000;
                --terminal-fg: #00ff66;
                --terminal-glow: rgba(0, 255, 102, 0.28);
                --terminal-glow-soft: rgba(0, 255, 102, 0.14);
                --terminal-border-muted: rgba(0, 255, 102, 0.56);
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                height: var(--app-height);
                padding: var(--page-pad);
                background: var(--terminal-bg);
                color: var(--terminal-fg);
                font-family:
                    ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                    "Liberation Mono", "Courier New", monospace;
                display: grid;
                place-items: center;
                overflow: hidden;
            }
            .terminal {
                width: min(920px, 100%);
                height: min(720px, calc(var(--app-height) - var(--page-pad) - var(--page-pad)));
                line-height: 1.55;
                font-size: 16px;
                display: grid;
                grid-template-rows: auto 1fr auto;
                overflow: hidden;
                background: var(--terminal-bg);
                border: 1px solid var(--terminal-fg);
                box-shadow:
                    0 0 2px var(--terminal-glow),
                    0 0 18px var(--terminal-glow-soft);
                text-shadow: 0 0 6px var(--terminal-glow-soft);
            }
            .terminal-titlebar {
                min-height: 34px;
                padding: 7px 14px;
                border-bottom: 1px solid var(--terminal-border-muted);
                display: grid;
                grid-template-columns: auto 1fr auto;
                align-items: center;
                gap: 12px;
                background: rgba(0, 255, 102, 0.06);
            }
            .terminal-controls {
                display: flex;
                gap: 7px;
            }
            .terminal-control {
                width: 9px;
                height: 9px;
                border: 1px solid var(--terminal-border-muted);
                border-radius: 50%;
                background: rgba(0, 255, 102, 0.14);
                box-shadow: 0 0 6px var(--terminal-glow-soft);
            }
            .terminal-title {
                min-width: 0;
                text-align: center;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                opacity: 0.86;
            }
            .terminal-titlebar::after {
                content: "";
                width: 55px;
            }
            .terminal-screen {
                min-height: 0;
                padding: 24px;
                overflow: auto;
                overflow-x: auto;
                scrollbar-color: var(--terminal-fg) var(--terminal-bg);
                scrollbar-gutter: stable;
            }
            .terminal-screen:focus-visible {
                outline: 1px solid var(--terminal-fg);
                outline-offset: -4px;
            }
            .output {
                overflow-wrap: anywhere;
                white-space: pre-wrap;
            }
            /* Fixed-width tables (standings) scroll sideways instead of wrapping. */
            .output-wide {
                white-space: pre;
                overflow-wrap: normal;
                overflow-x: auto;
                max-width: 100%;
                scrollbar-width: thin;
            }
            .quick-commands {
                display: none;
                gap: 8px;
                padding: 8px 12px;
                border-top: 1px solid var(--terminal-border-muted);
                overflow-x: auto;
                scrollbar-width: none;
            }
            .quick-commands::-webkit-scrollbar {
                display: none;
            }
            @media (pointer: coarse) {
                .quick-commands {
                    display: flex;
                }
            }
            .chip,
            .mode-exit {
                flex: none;
                background: transparent;
                color: var(--terminal-fg);
                border: 1px solid var(--terminal-border-muted);
                font: inherit;
                font-size: 14px;
                line-height: 1;
                padding: 9px 12px;
                min-height: 36px;
                cursor: pointer;
                text-shadow: inherit;
                -webkit-tap-highlight-color: transparent;
            }
            .chip:active,
            .mode-exit:active {
                background: var(--terminal-fg);
                color: var(--terminal-bg);
            }
            .chip:focus-visible,
            .mode-exit:focus-visible {
                outline: 1px solid var(--terminal-fg);
                outline-offset: 2px;
            }
            /* Full-screen ASCII modes (aurora, puck). Font is set inline per mode. */
            .ascii-overlay {
                position: fixed;
                inset: 0;
                z-index: 10;
                margin: 0;
                padding: 16px;
                background: #000;
                color: #00ff66;
                overflow: hidden;
                white-space: pre;
                text-align: left;
                touch-action: none;
                user-select: none;
                -webkit-user-select: none;
            }
            .ascii-overlay.centered {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .mode-exit {
                position: fixed;
                top: max(10px, env(safe-area-inset-top));
                right: max(10px, env(safe-area-inset-right));
                z-index: 30;
                background: var(--terminal-bg);
                font-family:
                    ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                    "Liberation Mono", "Courier New", monospace;
                text-shadow: 0 0 6px var(--terminal-glow-soft);
            }
            .prompt-line {
                display: flex;
                gap: 10px;
                align-items: baseline;
                margin-top: 10px;
            }
            .prompt {
                white-space: nowrap;
            }
            input {
                flex: 1;
                min-width: 0;
                background: transparent;
                border: none;
                outline: none;
                color: inherit;
                font: inherit;
                padding: 0;
                caret-color: var(--terminal-fg);
            }
            a {
                color: inherit;
                text-decoration: underline;
            }
            .dim {
                opacity: 0.75;
            }
            .film-overlay {
                position: fixed;
                inset: 0;
                z-index: 10;
                box-sizing: border-box;
                padding: 18px;
                background: var(--terminal-bg);
                color: var(--terminal-fg);
                font:
                    16px/1.45 ui-monospace,
                    SFMono-Regular,
                    Menlo,
                    Monaco,
                    Consolas,
                    "Liberation Mono",
                    "Courier New",
                    monospace;
                overflow: auto;
                text-shadow: 0 0 6px var(--terminal-glow-soft);
            }
            .film-shell {
                width: min(1000px, 100%);
                min-height: calc(100svh - 36px);
                margin: 0 auto;
                display: grid;
                grid-template-rows: auto 1fr auto;
                gap: 12px;
            }
            .film-path,
            .film-help {
                white-space: pre-wrap;
            }
            .film-grid {
                display: grid;
                grid-template-columns: minmax(260px, 0.9fr) minmax(280px, 1.4fr);
                gap: 12px;
                min-height: 0;
            }
            .film-pane {
                border: 1px solid var(--terminal-fg);
                min-height: 280px;
                padding: 12px;
                overflow: auto;
                box-sizing: border-box;
                box-shadow:
                    0 0 2px var(--terminal-glow),
                    0 0 10px var(--terminal-glow-soft);
            }
            .film-pane-title {
                margin-bottom: 10px;
                opacity: 0.75;
            }
            .film-row {
                white-space: pre;
                overflow: hidden;
                text-overflow: ellipsis;
                cursor: pointer;
                padding: 4px 0;
            }
            .film-path {

                padding-right: 90px;
            }
            .film-actions {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
            }
            .film-preview-img {
                cursor: zoom-in;
            }
            .film-row.active {
                background: var(--terminal-fg);
                color: var(--terminal-bg);
                text-shadow: none;
            }
            .film-preview-img {
                display: block;
                width: min(100%, 520px);
                max-height: 55vh;
                object-fit: contain;
                margin-top: 12px;
                border: 1px solid var(--terminal-fg);
                box-shadow:
                    0 0 2px var(--terminal-glow),
                    0 0 10px var(--terminal-glow-soft);
            }
            .film-empty {
                opacity: 0.75;
                white-space: pre-wrap;
            }
            .film-dialog {
                max-width: min(92vw, 1100px);
                max-height: 92vh;
                border: 1px solid var(--terminal-fg);
                background: var(--terminal-bg);
                color: var(--terminal-fg);
                font:
                    16px/1.45 ui-monospace,
                    SFMono-Regular,
                    Menlo,
                    Monaco,
                    Consolas,
                    "Liberation Mono",
                    "Courier New",
                    monospace;
                padding: 16px;
                text-shadow: 0 0 6px var(--terminal-glow-soft);
                box-shadow:
                    0 0 2px var(--terminal-glow),
                    0 0 14px var(--terminal-glow-soft);
            }
            .film-dialog::backdrop {
                background: rgba(0, 0, 0, 0.88);
            }
            .film-dialog img {
                display: block;
                max-width: 100%;
                max-height: 72vh;
                object-fit: contain;
                margin-bottom: 12px;
            }
            .film-dialog button {
                background: transparent;
                color: var(--terminal-fg);
                border: 1px solid var(--terminal-fg);
                font: inherit;
                padding: 4px 10px;
                cursor: pointer;
                box-shadow:
                    0 0 2px var(--terminal-glow),
                    0 0 8px var(--terminal-glow-soft);
            }
            @media (max-width: 720px) {
                :root {
                    --page-pad: 10px;
                }
                .terminal {
                    width: 100%;
                    height: calc(var(--app-height) - var(--page-pad) - var(--page-pad));
                    font-size: 14px;

                .prompt-line,
                input {
                    font-size: 16px;
                }
                .terminal-titlebar {
                    min-height: 30px;
                    padding: 6px 10px;
                    gap: 8px;
                }
                .terminal-control {
                    width: 8px;
                    height: 8px;
                }
                .terminal-titlebar::after {
                    width: 46px;
                }
                .terminal-screen {
                    padding: 16px;
                }
                .film-overlay {
                    padding: 12px;
                    font-size: 14px;
                }
                .film-shell {
                    min-height: calc(100svh - 24px);
                }
                .film-grid {
                    grid-template-columns: 1fr;
                }
                .film-pane {
                    min-height: 180px;

                .film-dialog {
                    text-shadow: none;

                    background: Canvas;
                    box-shadow: none;
                }
                .film-pane,
                .film-preview-img,
                .film-dialog,
                .film-dialog button,
                .terminal {
                    box-shadow: none;
                }
                .chip,
                .mode-exit {
                    text-shadow: none;
                }
            }

        <script>
            const terminal = document.querySelector(".terminal");
            const terminalScreen = document.getElementById("terminal-screen");
            const out = document.getElementById("out");
            const cmd = document.getElementById("cmd");

            // --- history state ---
            const history = [];
            let historyIndex = 0; // points to "next slot"; equals history.length when not browsing
            let draft = ""; // what the user had typed before browsing history
            let sudoCount = 0;
            // Per-mode state; set by each mode's start(), cleared by its stop().
            let auroraState = null;
            let hockeyState = null;
            let filmState = null;
            let filmManifestPromise = null;

            const MONO_STACK =
                "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace";
            const isCoarsePointer = () =>
                window.matchMedia("(pointer: coarse)").matches;

            // Append (rather than rewrite textContent) so block elements like
            // printBlock() output survive later prints.
            function print(text = "") {
                out.append(text + "\n");
                terminalScreen.scrollTop = terminalScreen.scrollHeight;
            }

            // Fixed-width text that should scroll sideways on narrow screens.
            function printBlock(text) {
                const block = document.createElement("div");
                block.className = "output-wide";
                block.textContent = text;
                out.appendChild(block);
                terminalScreen.scrollTop = terminalScreen.scrollHeight;
            }

            // Width of one monospace character at the given font size.
            function measureCharWidth(fontPx) {
                const probe = document.createElement("span");
                probe.style.cssText =
                    "visibility:hidden;position:absolute;white-space:pre;" +
                    `font-family:${MONO_STACK};font-size:${fontPx}px;`;
                probe.textContent = "X".repeat(20);
                document.body.appendChild(probe);
                const w = probe.getBoundingClientRect().width;
                probe.remove();
                return w > 0 ? w / 20 : fontPx * 0.6;
            }

            // --- modes ----------------------------------------------------
            // A mode is a full-screen takeover (aurora, puck, film, ...). Each
            // one is a plain object in `modes`; the framework below owns the
            // overlay element, the [x] exit chip, resize handling, the
            // animation loop and keyboard routing. All hooks are optional:
            //
            //   overlay:  { className, fontPx, lineHeight, label }
            //             fontPx => text overlay; ctx gets cw/cols/rows
            //   fps:      cap for frame(); omit for every animation frame
            //   reducedMotion: "static" => draw one frame, no loop
            //   start(ctx, ...args)   build state, attach pointer handlers
            //   frame(ctx, t, dt)     t = seconds since start, dt = seconds since last frame
            //   resize(ctx)           ctx.cols/rows are already updated
            //   keydown(ctx, e)       return true if handled; unhandled
            //                         Escape / q exits the mode
            //   keyup(ctx, e)
            //   stop(ctx)             drop state
            //   exitMessage           printed to the terminal on exit
            const modes = {};
            let activeMode = null; // the running mode's ctx, or null in the shell

            function enterMode(name, ...args) {
                if (activeMode) return;
                const def = modes[name];
                const spec = def.overlay || {};

                const overlay = document.createElement(spec.fontPx ? "pre" : "div");
                overlay.id = name;
                overlay.className = spec.className || "";
                if (spec.label) {
                    overlay.setAttribute("role", "application");
                    overlay.setAttribute("aria-label", spec.label);
                } else {
                    overlay.setAttribute("aria-hidden", "true");
                }
                if (spec.fontPx) {
                    // Set the font inline so we don't fight <pre>'s UA stylesheet
                    // (which switches to "monospace" and rescales font-size).
                    overlay.style.fontFamily = MONO_STACK;
                    overlay.style.fontSize = `${spec.fontPx}px`;
                    overlay.style.lineHeight = `${spec.lineHeight}px`;
                }
                document.body.appendChild(overlay);

                const exitChip = document.createElement("button");
                exitChip.type = "button";
                exitChip.className = "mode-exit";
                exitChip.textContent = "[x] exit";
                exitChip.setAttribute("aria-label", "Exit");
                exitChip.addEventListener("click", (e) => {
                    e.stopPropagation();
                    exitMode();
                });
                document.body.appendChild(exitChip);

                // Hide the on-screen keyboard; keys are routed at document level.
                cmd.blur();

                const ctx = {
                    name,
                    def,
                    overlay,
                    exitChip,
                    fontPx: spec.fontPx || 0,
                    lineHeight: spec.lineHeight || 0,
                    cw: spec.fontPx ? measureCharWidth(spec.fontPx) : 0,
                    cols: 0,
                    rows: 0,
                    reduced: window.matchMedia("(prefers-reduced-motion: reduce)")
                        .matches,
                    startTime: performance.now(),
                    rafId: null,
                    onResize: null,
                };
                activeMode = ctx;
                measureModeGrid(ctx);
                if (def.start) def.start(ctx, ...args);

                ctx.onResize = () => {
                    measureModeGrid(ctx);
                    if (def.resize) def.resize(ctx);
                    if (isStaticMode(ctx)) def.frame(ctx, 0, 0);
                };
                window.addEventListener("resize", ctx.onResize);

                if (def.frame) {
                    if (isStaticMode(ctx)) def.frame(ctx, 0, 0);
                    else runModeLoop(ctx);
                }
            }

            function exitMode() {
                const ctx = activeMode;
                if (!ctx) return;
                if (ctx.rafId) cancelAnimationFrame(ctx.rafId);
                window.removeEventListener("resize", ctx.onResize);
                if (ctx.def.stop) ctx.def.stop(ctx);
                ctx.exitChip.remove();
                ctx.overlay.remove();
                activeMode = null;
                cmd.value = "";
                // Don't pop the on-screen keyboard just because a mode closed.
                if (!isCoarsePointer()) cmd.focus();
                if (ctx.def.exitMessage) print(ctx.def.exitMessage);
            }

            function isStaticMode(ctx) {
                return ctx.reduced && ctx.def.reducedMotion === "static";
            }

            // Character grid that fits the viewport (text overlays only;
            // 32 = the overlay's 16px padding on each side).
            function measureModeGrid(ctx) {
                if (!ctx.cw) return;
                ctx.cols = Math.max(20, Math.floor((window.innerWidth - 32) / ctx.cw));
                ctx.rows = Math.max(
                    10,
                    Math.floor((window.innerHeight - 32) / ctx.lineHeight),
                );
            }

            // One loop for every animated mode. Uses performance.now() rather
            // than the rAF timestamp: they can come from different time origins
            // inside iframes (e.g. VS Code Live Preview), which once produced a
            // negative elapsed time and crashed the aurora palette.
            function runModeLoop(ctx) {
                const frameMs = ctx.def.fps ? 1000 / ctx.def.fps : 0;
                let last = performance.now();
                function tick() {
                    if (activeMode !== ctx) return;
                    const now = performance.now();
                    if (now - last >= frameMs) {
                        // Clamp dt so a long stall (e.g. a background tab, where
                        // browsers pause rAF) doesn't teleport anything.
                        const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
                        last = now;
                        const t = Math.max(0, (now - ctx.startTime) / 1000);
                        ctx.def.frame(ctx, t, dt);
                    }
                    ctx.rafId = requestAnimationFrame(tick);
                }
                ctx.rafId = requestAnimationFrame(tick);
            }

            function handleModeKeyDown(e) {
                const ctx = activeMode;
                if (ctx.def.keydown && ctx.def.keydown(ctx, e)) return;
                if (e.key === "Escape" || e.key === "q" || e.key === "Q") {
                    e.preventDefault();
                    exitMode();
                }
            }

            async function loadTextFile(path) {
                const res = await fetch(path, { cache: "no-cache" });
                if (!res.ok)
                    throw new Error(`Could not load ${path} (${res.status})`);
                return await res.text();

            // --- aurora ---------------------------------------------------
            // Hidden ASCII aurora overlay. Drifting curtain of layered sines,
            // 4-stop palette that cycles slowly through aurora-plausible hues.
            // Keypresses send a decaying pulse through the curtain.
            // Exit on q/Q or Escape.
            const AURORA_RAMP = " .'\":+*#%@";
            const AURORA_FPS = 24;
            const AURORA_PALETTES = [
                // [crown, mid, low, fringe]
                ["#bfffd9", "#00ff66", "#00aaaa", "#ff66cc"], // signature green w/ magenta fringe
                ["#cceeff", "#33ccff", "#3366cc", "#9933cc"], // ice → violet
                ["#ffeecc", "#aaff66", "#33aa66", "#117755"], // emerald
                ["#ffe0f0", "#ff99cc", "#cc3388", "#882266"], // rose
            ];

            function lerpColor(a, b, t) {
                const ah = parseInt(a.slice(1), 16),
                    bh = parseInt(b.slice(1), 16);
                const ar = (ah >> 16) & 0xff,
                    ag = (ah >> 8) & 0xff,
                    ab = ah & 0xff;
                const br = (bh >> 16) & 0xff,
                    bg = (bh >> 8) & 0xff,
                    bb = bh & 0xff;
                const r = Math.round(ar + (br - ar) * t);
                const g = Math.round(ag + (bg - ag) * t);
                const bl = Math.round(ab + (bb - ab) * t);
                return (
                    "#" +
                    ((r << 16) | (g << 8) | bl).toString(16).padStart(6, "0")
                );
            }

            function auroraPalette(t) {
                const cycleSeconds = 24;
                const n = AURORA_PALETTES.length;
                // Positive modulo so negative t (clock drift) doesn't produce a negative index.
                const phase = (((t / cycleSeconds) % n) + n) % n;
                const i = Math.floor(phase);
                const f = phase - i;
                const a = AURORA_PALETTES[i];
                const b = AURORA_PALETTES[(i + 1) % n];
                return [
                    lerpColor(a[0], b[0], f),
                    lerpColor(a[1], b[1], f),
                    lerpColor(a[2], b[2], f),
                    lerpColor(a[3], b[3], f),
                ];
            }

            function curtainHeight(x, t, pulses) {
                let h = 0;
                h += Math.sin(x * 0.08 + t * 0.4) * 3;
                h += Math.sin(x * 0.15 - t * 0.7) * 2;
                h += Math.sin(x * 0.04 + t * 0.2) * 4;
                for (const p of pulses) {
                    const dt = t - p.t0;
                    const decay = Math.exp(-dt * 0.8);
                    const dx = x - p.x;
                    h +=
                        decay *
                        3 *
                        Math.cos(dx * 0.3 - dt * 4) *
                        Math.exp(-dx * dx * 0.01);
                }
                return h;
            }

            function renderAuroraFrame(t) {
                const { cols, rows, overlay } = auroraState;
                const palette = auroraPalette(t);
                const midRow = rows / 2;
                auroraState.pulses = auroraState.pulses.filter(
                    (p) => t - p.t0 < 5,
                );
                const pulses = auroraState.pulses;
                const heights = auroraState.heights;
                const shimmer = auroraState.shimmer;

                for (let x = 0; x < cols; x++) {
                    heights[x] = curtainHeight(x, t, pulses);
                    shimmer[x] = 0.7 + 0.3 * Math.sin(x * 0.2 + t * 0.5);
                }

                const lines = [];
                for (let y = 0; y < rows; y++) {
                    let line = "";
                    let runColor = null;
                    let runText = "";
                    for (let x = 0; x < cols; x++) {
                        const ch = heights[x];
                        const dy = y - (midRow + ch);
                        let b;
                        if (dy < 0)
                            b = Math.max(0, 1 + dy * 0.5); // quick falloff above
                        else b = Math.max(0, 1 - dy * 0.18); // long tail below
                        b *= shimmer[x]; // subtle horizontal modulation
                        b = Math.max(0, Math.min(1, b));

                        const cIdx = Math.floor(b * (AURORA_RAMP.length - 1));
                        const character = AURORA_RAMP[cIdx];

                        let color = null;
                        if (character !== " ") {
                            if (dy < -1)
                                color = palette[0]; // crown
                            else if (dy < 1)
                                color = palette[1]; // mid (the bright body)
                            else if (dy < 3)
                                color = palette[2]; // low
                            else color = palette[3]; // fringe
                        }
                        if (color === runColor) {
                            runText += character;
                        } else {
                            if (runText) {
                                line += runColor
                                    ? `<span style="color:${runColor}">${runText}</span>`
                                    : runText;
                            }
                            runColor = color;
                            runText = character;
                        }
                    }
                    if (runText) {
                        line += runColor
                            ? `<span style="color:${runColor}">${runText}</span>`
                            : runText;
                    }
                    lines.push(line);
                }
                overlay.innerHTML = lines.join("\n");
            }

            // Resize the per-column buffers to the current grid.
            function sizeAuroraBuffers(ctx) {
                auroraState.cols = ctx.cols;
                auroraState.rows = ctx.rows;
                auroraState.heights = new Array(ctx.cols);
                auroraState.shimmer = new Array(ctx.cols);
            }

            modes.aurora = {
                overlay: { className: "ascii-overlay", fontPx: 16, lineHeight: 18 },
                fps: AURORA_FPS,
                reducedMotion: "static",
                exitMessage: "aurora dimmed.",
                start(ctx) {
                    auroraState = {
                        overlay: ctx.overlay,
                        startTime: ctx.startTime,
                        pulses: [],
                    };
                    sizeAuroraBuffers(ctx);
                    // Tap / click sends a pulse from that column.
                    ctx.overlay.addEventListener("pointerdown", (e) => {
                        pulseAurora(null, Math.floor((e.clientX - 16) / ctx.cw));
                    });
                },
                resize: sizeAuroraBuffers,
                frame(ctx, t) {
                    renderAuroraFrame(t);
                },
                keydown(ctx, e) {
                    // Any printable key except q pulses the curtain.
                    if (e.key.length !== 1 || e.key.toLowerCase() === "q") return false;
                    e.preventDefault();
                    pulseAurora(e.key);
                    return true;
                },
                stop() {
                    auroraState = null;
                },
            };

            function pulseAurora(key, col = null) {
                if (!auroraState) return;
                const cols = auroraState.cols;
                const x =
                    col !== null
                        ? clamp(col, 0, cols - 1)
                        : key && key.length === 1
                          ? (key.charCodeAt(0) * 7) % cols
                          : Math.floor(Math.random() * cols);
                auroraState.pulses.push({
                    x,
                    t0: (performance.now() - auroraState.startTime) / 1000,
                });
                if (auroraState.pulses.length > 8) auroraState.pulses.shift();
            }

            // --- puckies --------------------------------------------------
            // One-shot ASCII rubber duck cameo. It isn't a mode, so
            // the terminal remains usable as soon as the animation cleans up.
            const DUCK_ART = [
                "                          __(o)>",
                " puck it up!             \\<_. )",
                "                          `---'",
            ].join("\n");

            function runDuck() {
                const existing = document.getElementById("puckies-duck");
                if (existing) existing.remove();

                const overlay = document.createElement("pre");
                overlay.id = "puckies-duck";
                overlay.setAttribute("aria-hidden", "true");
                overlay.textContent = DUCK_ART;
                overlay.style.cssText =
                    "position:fixed;left:0;top:50%;margin:0;" +
                    `font-family:${MONO_STACK};font-size:16px;line-height:18px;` +
                    "color:#00ff66;text-shadow:0 0 8px rgba(0,255,102,0.45);" +
                    "background:transparent;white-space:pre;pointer-events:none;" +
                    "z-index:20;will-change:transform;transform-origin:center center;";
                document.body.appendChild(overlay);

                const duckWidth = overlay.getBoundingClientRect().width || 140;
                const startX = -duckWidth - 24;
                const endX = window.innerWidth + 24;
                const baseY = -overlay.offsetHeight / 2;
                const reduced = window.matchMedia(
                    "(prefers-reduced-motion: reduce)",
                ).matches;
                const duration = 9200;
                const wobble = 8;
                const startTime = performance.now();
                overlay.style.transform = `translate3d(${startX}px, ${baseY}px, 0)`;

                function finish() {
                    overlay.remove();
                    if (!isCoarsePointer()) cmd.focus();
                }

                if (reduced) {
                    const x = Math.max(16, (window.innerWidth - duckWidth) / 2);
                    overlay.style.transform = `translate3d(${x}px, ${baseY}px, 0)`;
                    setTimeout(finish, 900);
                    return;
                }

                function frame(now) {
                    const elapsed = now - startTime;
                    const t = Math.min(1, elapsed / duration);
                    const eased = 1 - Math.pow(1 - t, 3);
                    const x = startX + (endX - startX) * eased;
                    const y = baseY + Math.sin(t * Math.PI * 8) * wobble;

                    overlay.style.transform = `translate3d(${x}px, ${y}px, 0)`;

                    if (t < 1) {
                        requestAnimationFrame(frame);
                    } else {
                        finish();
                    }
                }

                requestAnimationFrame(frame);
            }

            // --- hockey ---------------------------------------------------
            // Hidden terminal hockey: a tiny pong-like rink rendered as ASCII.
            const HOCKEY_WIDTH = 64;
            const HOCKEY_HEIGHT = 22;
            const HOCKEY_WIN_SCORE = 5;
            const HOCKEY_STICK_SIZE = 5;

            function clamp(n, min, max) {
                return Math.max(min, Math.min(max, n));
            }

            function resetHockeyPuck(direction = 1) {
                if (!hockeyState) return;
                hockeyState.puckX = Math.floor(HOCKEY_WIDTH / 2);
                hockeyState.puckY = Math.floor(HOCKEY_HEIGHT / 2);
                hockeyState.puckVX = direction * (18 + Math.random() * 3);
                hockeyState.puckVY =
                    (Math.random() > 0.5 ? 1 : -1) * (6 + Math.random() * 5);
                hockeyState.messageUntil = performance.now() + 900;
            }

            function restartHockey() {
                if (!hockeyState) return;
                hockeyState.playerY = Math.floor(HOCKEY_HEIGHT / 2);
                hockeyState.cpuY = Math.floor(HOCKEY_HEIGHT / 2);
                hockeyState.playerScore = 0;
                hockeyState.cpuScore = 0;
                hockeyState.paused = false;
                hockeyState.gameOver = false;
                hockeyState.keys.clear();
                resetHockeyPuck(Math.random() > 0.5 ? 1 : -1);
                renderHockeyFrame();
            }

            function updateHockey(dt) {
                if (!hockeyState || hockeyState.paused || hockeyState.gameOver)
                    return;

                const maxY = HOCKEY_HEIGHT - 2;
                const playerSpeed = 26;
                const cpuSpeed = 15;

                if (
                    hockeyState.keys.has("ArrowUp") ||
                    hockeyState.keys.has("w")
                ) {
                    hockeyState.playerY -= playerSpeed * dt;
                }
                if (
                    hockeyState.keys.has("ArrowDown") ||
                    hockeyState.keys.has("s")
                ) {
                    hockeyState.playerY += playerSpeed * dt;
                }
                hockeyState.playerY = clamp(
                    hockeyState.playerY,
                    2,
                    maxY - HOCKEY_STICK_SIZE + 1,
                );

                const cpuTarget =
                    hockeyState.puckY - Math.floor(HOCKEY_STICK_SIZE / 2);
                const cpuDelta = clamp(
                    cpuTarget - hockeyState.cpuY,
                    -cpuSpeed * dt,
                    cpuSpeed * dt,
                );
                hockeyState.cpuY = clamp(
                    hockeyState.cpuY + cpuDelta,
                    2,
                    maxY - HOCKEY_STICK_SIZE + 1,
                );

                hockeyState.puckX += hockeyState.puckVX * dt;
                hockeyState.puckY += hockeyState.puckVY * dt;

                if (hockeyState.puckY <= 1) {
                    hockeyState.puckY = 1;
                    hockeyState.puckVY = Math.abs(hockeyState.puckVY);
                }
                if (hockeyState.puckY >= maxY) {
                    hockeyState.puckY = maxY;
                    hockeyState.puckVY = -Math.abs(hockeyState.puckVY);
                }

                const puckX = Math.round(hockeyState.puckX);
                const puckY = Math.round(hockeyState.puckY);
                const playerTop = Math.round(hockeyState.playerY);
                const cpuTop = Math.round(hockeyState.cpuY);

                if (
                    puckX <= 4 &&
                    puckX >= 3 &&
                    puckY >= playerTop &&
                    puckY < playerTop + HOCKEY_STICK_SIZE &&
                    hockeyState.puckVX < 0
                ) {
                    hockeyState.puckX = 5;
                    hockeyState.puckVX = Math.abs(hockeyState.puckVX) + 1.2;
                    hockeyState.puckVY +=
                        (puckY - (playerTop + HOCKEY_STICK_SIZE / 2)) * 2.5;
                }

                if (
                    puckX >= HOCKEY_WIDTH - 5 &&
                    puckX <= HOCKEY_WIDTH - 4 &&
                    puckY >= cpuTop &&
                    puckY < cpuTop + HOCKEY_STICK_SIZE &&
                    hockeyState.puckVX > 0
                ) {
                    hockeyState.puckX = HOCKEY_WIDTH - 6;
                    hockeyState.puckVX = -Math.abs(hockeyState.puckVX) - 0.7;
                    hockeyState.puckVY +=
                        (puckY - (cpuTop + HOCKEY_STICK_SIZE / 2)) * 2.1;
                }

                hockeyState.puckVY = clamp(hockeyState.puckVY, -18, 18);

                if (hockeyState.puckX < 0) {
                    hockeyState.cpuScore++;
                    if (hockeyState.cpuScore >= HOCKEY_WIN_SCORE) {
                        hockeyState.gameOver = true;
                    } else {
                        resetHockeyPuck(1);
                    }
                }

                if (hockeyState.puckX > HOCKEY_WIDTH - 1) {
                    hockeyState.playerScore++;
                    if (hockeyState.playerScore >= HOCKEY_WIN_SCORE) {
                        hockeyState.gameOver = true;
                    } else {
                        resetHockeyPuck(-1);
                    }
                }
            }

            function renderHockeyFrame() {
                if (!hockeyState) return;

                const grid = Array.from({ length: HOCKEY_HEIGHT }, () =>
                    Array(HOCKEY_WIDTH).fill(" "),
                );
                const centerX = Math.floor(HOCKEY_WIDTH / 2);
                const goalTop = Math.floor(HOCKEY_HEIGHT / 2) - 3;
                const goalBottom = Math.floor(HOCKEY_HEIGHT / 2) + 3;

                for (let x = 0; x < HOCKEY_WIDTH; x++) {
                    grid[0][x] = x === 0 || x === HOCKEY_WIDTH - 1 ? "+" : "-";
                    grid[HOCKEY_HEIGHT - 1][x] =
                        x === 0 || x === HOCKEY_WIDTH - 1 ? "+" : "-";
                }
                for (let y = 1; y < HOCKEY_HEIGHT - 1; y++) {
                    grid[y][0] = y >= goalTop && y <= goalBottom ? " " : "|";
                    grid[y][HOCKEY_WIDTH - 1] =
                        y >= goalTop && y <= goalBottom ? " " : "|";
                    grid[y][centerX] = ":";
                }
                grid[goalTop][0] = "{";
                grid[goalBottom][0] = "{";
                grid[goalTop][HOCKEY_WIDTH - 1] = "}";
                grid[goalBottom][HOCKEY_WIDTH - 1] = "}";

                const playerTop = Math.round(hockeyState.playerY);
                const cpuTop = Math.round(hockeyState.cpuY);
                for (let i = 0; i < HOCKEY_STICK_SIZE; i++) {
                    grid[playerTop + i][3] = "]";
                    grid[cpuTop + i][HOCKEY_WIDTH - 4] = "[";
                }

                if (!hockeyState.gameOver) {
                    const puckX = clamp(
                        Math.round(hockeyState.puckX),
                        1,
                        HOCKEY_WIDTH - 2,
                    );
                    const puckY = clamp(
                        Math.round(hockeyState.puckY),
                        1,
                        HOCKEY_HEIGHT - 2,
                    );
                    grid[puckY][puckX] = "o";
                }

                const rink = grid.map((row) => row.join("")).join("\n");
                const touch = hockeyState.touch;
                const hud = [
                    `PUCKIES ${hockeyState.playerScore}  |  CPU ${hockeyState.cpuScore}`,
                    "",
                    touch
                        ? "first to 5 | drag to move | tap pause"
                        : "first to 5 | arrows/ws move    space pause |  q exits",
                ];

                if (hockeyState.paused) {
                    hud.push(touch ? "paused | tap resumes" : "paused | space resumes");
                } else if (hockeyState.gameOver) {
                    const won = hockeyState.playerScore > hockeyState.cpuScore;
                    hud.push(
                        won
                            ? "you win! bench door status: flying open."
                            : "cpu wins. you'll get 'em next time!",
                    );
                    hud.push(touch ? "tap restarts" : "r restarts | q exits");
                } else if (performance.now() < hockeyState.messageUntil) {
                    hud.push("faceoff...");
                } else {
                    hud.push("");
                }

                hockeyState.overlay.textContent =
                    hud.join("\n") + "\n\n" + rink;
            }

            modes.hockey = {
                overlay: {
                    className: "ascii-overlay centered",
                    fontPx: 16,
                    lineHeight: 18,
                },
                exitMessage: "you've returned to the bench. nice shift!",
                start: startHockey,
                resize: layoutHockey,
                frame(ctx, t, dt) {
                    updateHockey(Math.min(0.04, dt));
                    renderHockeyFrame();
                },
                keydown(ctx, e) {
                    return handleHockeyKeyDown(e);
                },
                keyup(ctx, e) {
                    handleHockeyKeyUp(e);
                },
                stop() {
                    hockeyState = null;
                },
            };

            function startHockey(ctx) {
                const overlay = ctx.overlay;
                hockeyState = {
                    overlay,
                    touch: isCoarsePointer(),
                    charRatio: ctx.cw / ctx.fontPx,
                    lineHeight: ctx.lineHeight,
                    drag: null,
                    playerY: Math.floor(HOCKEY_HEIGHT / 2),
                    cpuY: Math.floor(HOCKEY_HEIGHT / 2),
                    puckX: Math.floor(HOCKEY_WIDTH / 2),
                    puckY: Math.floor(HOCKEY_HEIGHT / 2),
                    puckVX: 0,
                    puckVY: 0,
                    playerScore: 0,
                    cpuScore: 0,
                    paused: false,
                    gameOver: false,
                    messageUntil: 0,
                    keys: new Set(),
                };
                resetHockeyPuck(Math.random() > 0.5 ? 1 : -1);
                layoutHockey();

                // Touch / mouse: drag anywhere moves your stick relative to
                // where the finger started; a short tap pauses or restarts.
                overlay.addEventListener("pointerdown", (e) => {
                    if (!hockeyState) return;
                    overlay.setPointerCapture(e.pointerId);
                    hockeyState.drag = {
                        id: e.pointerId,
                        startY: e.clientY,
                        lastY: e.clientY,
                        moved: false,
                    };
                });
                overlay.addEventListener("pointermove", (e) => {
                    const drag = hockeyState && hockeyState.drag;
                    if (!drag || drag.id !== e.pointerId) return;
                    const dy = e.clientY - drag.lastY;
                    drag.lastY = e.clientY;
                    if (Math.abs(e.clientY - drag.startY) > 6) drag.moved = true;
                    if (hockeyState.paused || hockeyState.gameOver) return;
                    hockeyState.playerY = clamp(
                        hockeyState.playerY + dy / hockeyState.lineHeight,
                        2,
                        HOCKEY_HEIGHT - 2 - HOCKEY_STICK_SIZE + 1,
                    );
                });
                const endDrag = (e) => {
                    const drag = hockeyState && hockeyState.drag;
                    if (!drag || drag.id !== e.pointerId) return;
                    hockeyState.drag = null;
                    if (drag.moved || e.type === "pointercancel") return;
                    if (hockeyState.gameOver) {
                        restartHockey();
                    } else {
                        hockeyState.paused = !hockeyState.paused;
                        renderHockeyFrame();
                    }
                };
                overlay.addEventListener("pointerup", endDrag);
                overlay.addEventListener("pointercancel", endDrag);
            }

            // Shrink the font so the whole rink + HUD fits the viewport
            // (the rink is 64 columns, ~620px at 16px — wider than phones).
            function layoutHockey() {
                if (!hockeyState) return;
                const HUD_LINES = 5; // 4 HUD lines + blank spacer
                const totalLines = HUD_LINES + HOCKEY_HEIGHT;
                const availW = window.innerWidth - 32;
                // leave room for the [x] exit chip at the top
                const availH = window.innerHeight - 32 - 48;
                const fitW = availW / (HOCKEY_WIDTH * hockeyState.charRatio);
                const fitH = availH / (totalLines * 1.125);
                const fontPx = clamp(Math.floor(Math.min(16, fitW, fitH) * 2) / 2, 7, 16);
                hockeyState.lineHeight = fontPx * 1.125;
                hockeyState.overlay.style.fontSize = `${fontPx}px`;
                hockeyState.overlay.style.lineHeight = `${hockeyState.lineHeight}px`;
            }

            // Returns true when the key was handled; Escape / q fall through
            // to the mode framework, which exits.
            function handleHockeyKeyDown(e) {
                if (!hockeyState) return false;
                if (e.key === "Escape" || e.key === "q" || e.key === "Q")
                    return false;
                e.preventDefault();

                if (e.key === " " || e.code === "Space") {
                    hockeyState.paused = !hockeyState.paused;
                    renderHockeyFrame();
                    return true;
                }
                if (hockeyState.gameOver && (e.key === "r" || e.key === "R")) {
                    restartHockey();
                    return true;
                }

                const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
                if (
                    key === "ArrowUp" ||
                    key === "ArrowDown" ||
                    key === "w" ||
                    key === "s"
                ) {
                    hockeyState.keys.add(key);
                }
                return true;
            }

            function handleHockeyKeyUp(e) {
                if (!hockeyState) return;
                const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
                hockeyState.keys.delete(key);
            }

            // --- film -----------------------------------------------------
            const FILM_MANIFEST_PATH = "photos/manifest.json";

            async function loadFilmManifest() {
                if (!filmManifestPromise) {
                    filmManifestPromise = fetch(FILM_MANIFEST_PATH, {
                        cache: "no-cache",
                    })
                        .then((res) => {
                            if (!res.ok)
                                throw new Error(
                                    `Could not load ${FILM_MANIFEST_PATH} (${res.status})`,
                                );
                            return res.json();
                        })
                        .then((data) => ({
                            rolls: Array.isArray(data.rolls) ? data.rolls : [],
                        }));
                }
                return filmManifestPromise;
            }

            async function runFilmCommand(args = []) {
                let manifest;
                try {
                    manifest = await loadFilmManifest();
                } catch (e) {
                    print(`film error: ${e.message}`);
                    return;
                }

                const [first] = args;
                const subcommand = first ? first.toLowerCase() : "";

                if (subcommand === "list") {
                    printFilmList(manifest);
                    return;
                }

                if (subcommand === "random") {
                    openRandomFilmPhoto(manifest);
                    return;
                }

                if (subcommand === "open") {
                    const rollId = args.slice(1).join(" ");
                    if (!rollId) {
                        print("usage: film open <roll-id>");
                        return;
                    }
                    enterMode("film", manifest, rollId);
                    return;
                }

                enterMode("film", manifest, args.join(" ") || null);
            }

            function printFilmList(manifest) {
                const rolls = manifest.rolls;
                if (!rolls.length) {
                    print("/decyphered/photos");
                    print(
                        "no rolls yet. add photos/manifest.json entries to start a roll.",
                    );
                    return;
                }

                const lines = ["/decyphered/photos", "", "rolls", "-----"];
                for (const roll of rolls) {
                    const count = Array.isArray(roll.photos)
                        ? roll.photos.length
                        : 0;
                    lines.push(
                        `${roll.id}  ${count} photo${count === 1 ? "" : "s"}`,
                    );
                }
                print(lines.join("\n"));
            }

            modes.film = {
                overlay: { className: "film-overlay", label: "Film browser" },
                exitMessage: "film browser closed.",
                start(ctx, manifest, initialRollId = null) {
                    const foundRollIndex = initialRollId
                        ? manifest.rolls.findIndex(
                              (roll) => roll.id === initialRollId,
                          )
                        : -1;
                    filmState = {
                        manifest,
                        overlay: ctx.overlay,
                        view: foundRollIndex >= 0 ? "photos" : "rolls",
                        rollIndex: Math.max(0, foundRollIndex),
                        photoIndex: 0,
                        dialog: null,
                        narrow: null,
                    };
                    renderFilmBrowser();
                },
                // Re-render only when crossing the narrow breakpoint (row padding changes).
                resize() {
                    if (filmState.narrow !== isFilmNarrow()) renderFilmBrowser();
                },
                keydown(ctx, e) {
                    return handleFilmKeyDown(e);
                },
                stop() {
                    if (filmState.dialog) filmState.dialog.remove();
                    filmState = null;
                },
            };

            function isFilmNarrow() {
                return window.innerWidth < 560;
            }

            function filmBack() {
                if (!filmState || filmState.view !== "photos") return;
                filmState.view = "rolls";
                renderFilmBrowser();
            }

            function currentFilmRoll() {
                if (!filmState) return null;
                return filmState.manifest.rolls[filmState.rollIndex] || null;
            }

            function currentFilmPhotos() {
                const roll = currentFilmRoll();
                return roll && Array.isArray(roll.photos) ? roll.photos : [];
            }

            function setText(parent, text, className = null) {
                const node = document.createElement("div");
                if (className) node.className = className;
                node.textContent = text;
                parent.appendChild(node);
                return node;
            }

            function renderFilmBrowser() {
                if (!filmState) return;

                const { overlay, manifest, view } = filmState;
                const rolls = manifest.rolls;
                const roll = currentFilmRoll();
                const photos = currentFilmPhotos();
                filmState.narrow = isFilmNarrow();
                overlay.innerHTML = "";

                const shell = document.createElement("div");
                shell.className = "film-shell";
                overlay.appendChild(shell);

                const header = document.createElement("div");
                header.className = "film-path";
                shell.appendChild(header);
                setText(
                    header,
                    view === "photos" && roll
                        ? `/film/${roll.id}`
                        : "/decyphered/photos",
                );
                if (view === "photos") {
                    const back = document.createElement("button");
                    back.type = "button";
                    back.className = "chip";
                    back.style.marginTop = "8px";
                    back.textContent = "< rolls";
                    back.addEventListener("click", filmBack);
                    header.appendChild(back);
                }

                const grid = document.createElement("div");
                grid.className = "film-grid";
                shell.appendChild(grid);

                const listPane = document.createElement("section");
                listPane.className = "film-pane";
                grid.appendChild(listPane);

                const previewPane = document.createElement("section");
                previewPane.className = "film-pane";
                grid.appendChild(previewPane);

                if (view === "rolls") {
                    renderFilmRollsPane(listPane, rolls);
                    renderFilmRollPreview(previewPane, roll);
                } else {
                    renderFilmPhotosPane(listPane, roll, photos);
                    renderFilmPhotoPreview(
                        previewPane,
                        roll,
                        photos[filmState.photoIndex],
                    );
                }

                const help = isCoarsePointer()
                    ? view === "rolls"
                        ? "tap a roll to open it"
                        : "tap a photo to view it full size"
                    : view === "rolls"
                      ? "j/k or arrows move | enter opens roll | q quits"
                      : "j/k or arrows move | enter opens photo | esc back | q quits";
                setText(shell, help, "film-help");
            }

            function renderFilmRollsPane(parent, rolls) {
                setText(parent, "rolls", "film-pane-title");
                if (!rolls.length) {
                    setText(
                        parent,
                        "no rolls yet.\n\nAdd entries to photos/manifest.json, then place optimized images in photos/thumbs and photos/full.",
                        "film-empty",
                    );
                    return;
                }

                rolls.forEach((roll, index) => {
                    const count = Array.isArray(roll.photos)
                        ? roll.photos.length
                        : 0;
                    const marker = index === filmState.rollIndex ? "> " : "  ";
                    const pad = filmState.narrow ? 18 : 28;
                    const row = setText(
                        parent,
                        `${marker}${roll.id.padEnd(pad)} ${String(count).padStart(2)} photo${count === 1 ? "" : "s"}`,
                        "film-row",
                    );
                    if (index === filmState.rollIndex)
                        row.classList.add("active");
                    row.addEventListener("click", () => {
                        filmState.rollIndex = index;
                        openFilmSelection();
                    });
                });
            }

            function renderFilmRollPreview(parent, roll) {
                setText(parent, "preview", "film-pane-title");
                if (!roll) {
                    setText(
                        parent,
                        "empty darkroom.\n\nTry: film list",
                        "film-empty",
                    );
                    return;
                }

                const count = Array.isArray(roll.photos)
                    ? roll.photos.length
                    : 0;
                setText(parent, roll.title || roll.id);
                if (roll.camera) setText(parent, `camera: ${roll.camera}`);
                if (roll.description) setText(parent, `\n${roll.description}`);
                setText(parent, `\n${count} photo${count === 1 ? "" : "s"}`);

                const cover =
                    roll.photos && roll.photos[0] && roll.photos[0].thumb;
                if (cover)
                    appendFilmImage(
                        parent,
                        cover,
                        roll.photos[0].alt ||
                            `${roll.title || roll.id} preview`,
                    );
            }

            function renderFilmPhotosPane(parent, roll, photos) {
                setText(
                    parent,
                    roll ? roll.title || roll.id : "photos",
                    "film-pane-title",
                );
                if (!photos.length) {
                    setText(
                        parent,
                        "this roll has no photos yet.",
                        "film-empty",
                    );
                    return;
                }

                photos.forEach((photo, index) => {
                    const marker = index === filmState.photoIndex ? "> " : "  ";
                    const row = setText(
                        parent,
                        `${marker}${photo.id || String(index + 1).padStart(3, "0")}  ${photo.title || "untitled"}`,
                        "film-row",
                    );
                    if (index === filmState.photoIndex)
                        row.classList.add("active");
                    row.addEventListener("click", () => {
                        filmState.photoIndex = index;
                        renderFilmBrowser();
                        openFilmSelection();
                    });
                });
            }

            function renderFilmPhotoPreview(parent, roll, photo) {
                setText(parent, "preview", "film-pane-title");
                if (!photo) {
                    setText(parent, "no photo selected.", "film-empty");
                    return;
                }

                setText(
                    parent,
                    `${photo.id || ""}  ${photo.title || "untitled"}`.trim(),
                );
                if (roll && roll.camera)
                    setText(parent, `camera: ${roll.camera}`);
                if (photo.alt) setText(parent, `\n${photo.alt}`);
                if (photo.thumb) {
                    const img = appendFilmImage(
                        parent,
                        photo.thumb,
                        photo.alt || photo.title || "Film photo preview",
                    );
                    img.addEventListener("click", () =>
                        openFilmDialog(photo, roll),
                    );
                }
            }

            function appendFilmImage(parent, src, alt) {
                const img = document.createElement("img");
                img.className = "film-preview-img";
                img.loading = "lazy";
                img.src = src;
                img.alt = alt;
                parent.appendChild(img);
                return img;
            }

            function moveFilmSelection(delta) {
                if (!filmState) return;
                if (filmState.view === "rolls") {
                    const count = filmState.manifest.rolls.length;
                    if (!count) return;
                    filmState.rollIndex =
                        (filmState.rollIndex + delta + count) % count;
                } else {
                    const count = currentFilmPhotos().length;
                    if (!count) return;
                    filmState.photoIndex =
                        (filmState.photoIndex + delta + count) % count;
                }
                renderFilmBrowser();
            }

            function openFilmSelection() {
                if (!filmState) return;
                if (filmState.view === "rolls") {
                    if (!filmState.manifest.rolls.length) return;
                    filmState.view = "photos";
                    filmState.photoIndex = 0;
                    renderFilmBrowser();
                    return;
                }

                const photo = currentFilmPhotos()[filmState.photoIndex];
                if (photo) openFilmDialog(photo, currentFilmRoll());
            }

            function openRandomFilmPhoto(manifest) {
                const entries = [];
                for (const roll of manifest.rolls) {
                    const photos = Array.isArray(roll.photos)
                        ? roll.photos
                        : [];
                    for (const photo of photos) entries.push({ roll, photo });
                }

                if (!entries.length) {
                    print("film random: no photos yet.");
                    return;
                }

                const entry =
                    entries[Math.floor(Math.random() * entries.length)];
                print(
                    `${entry.roll.id}/${entry.photo.id || "photo"}  ${entry.photo.title || "untitled"}`,
                );
                openFilmDialog(entry.photo, entry.roll);
            }

            function openFilmDialog(photo, roll) {
                const dialog = document.createElement("dialog");
                dialog.className = "film-dialog";

                const img = document.createElement("img");
                img.src = photo.full || photo.thumb;
                img.alt = photo.alt || photo.title || "Film photo";
                dialog.appendChild(img);

                setText(
                    dialog,
                    `${roll ? roll.title || roll.id : "film"} / ${photo.id || "photo"}`,
                );
                setText(dialog, photo.title || "untitled");
                if (photo.alt) setText(dialog, photo.alt);

                const close = document.createElement("button");
                close.type = "button";
                close.textContent = "close";
                close.addEventListener("click", () => dialog.close());
                dialog.appendChild(close);

                dialog.addEventListener("close", () => {
                    dialog.remove();
                    if (filmState && filmState.dialog === dialog) {
                        filmState.dialog = null;
                    }
                    if (!isCoarsePointer() && !filmState) cmd.focus();
                });

                document.body.appendChild(dialog);
                if (filmState) filmState.dialog = dialog;
                if (dialog.showModal) dialog.showModal();
                else dialog.setAttribute("open", "");
                close.focus();
            }

            // Returns true when the key was handled. Escape at the roll list and
            // q fall through to the mode framework, which exits.
            function handleFilmKeyDown(e) {
                // An open photo dialog handles its own keys (Escape closes it).
                if (!filmState || filmState.dialog) return true;

                if (e.key === "Escape" && filmState.view === "photos") {
                    e.preventDefault();
                    filmBack();
                    return true;
                }
                if (e.key === "Escape" || e.key === "q" || e.key === "Q")
                    return false;

                e.preventDefault();
                if (e.key === "ArrowDown" || e.key === "j") {
                    moveFilmSelection(1);
                } else if (e.key === "ArrowUp" || e.key === "k") {
                    moveFilmSelection(-1);
                } else if (e.key === "Enter") {
                    openFilmSelection();
                }
                return true;
            }

            async function runCommand(raw) {
                const input = raw.trim();
                if (!input) return;

                print(`$ ${input}`);

                const [name, ...args] = input.split(/\s+/);
                const command = commands[name.toLowerCase()];

                if (!command) {
                    print(`command not found: ${name}`);
                    return;
                }

                await command.run(args);
            }

            function recordHistory(raw) {
                const trimmed = raw.trim();
                if (!trimmed) return;
                if (history[history.length - 1] === trimmed) return; // skip consecutive duplicates
                history.push(trimmed);
            }

            // Keys are handled at document level: full-screen modes accept taps,
            // which can move focus off the input, but keyboard control must keep
            // working. Mode is checked once, before any command runs, so the Enter
            // that launches a mode isn't also delivered to it.
            document.addEventListener("keydown", async (e) => {
                // Let focused buttons (exit chip, back) handle their own activation.
                if (
                    activeMode &&
                    e.target instanceof HTMLButtonElement &&
                    (e.key === "Enter" || e.key === " ")
                )
                    return;

                if (activeMode) {
                    handleModeKeyDown(e);
                    return;
                }

                if (e.target !== cmd) return;

                if (e.key === "Enter") {
                    const value = cmd.value;
                    cmd.value = "";
                    recordHistory(value);
                    historyIndex = history.length; // reset browse position
                    draft = "";
                    await runCommand(value);
                    return;
                }

                if (e.key === "ArrowUp") {
                    if (history.length === 0) return;
                    e.preventDefault();
                    // If we're at the "fresh" position, save current input as draft before browsing
                    if (historyIndex === history.length) {
                        draft = cmd.value;
                    }
                    if (historyIndex > 0) {
                        historyIndex--;
                        cmd.value = history[historyIndex];
                        // Move cursor to end
                        cmd.setSelectionRange(
                            cmd.value.length,
                            cmd.value.length,
                        );
                    }
                    return;
                }

                if (e.key === "ArrowDown") {
                    if (history.length === 0) return;
                    e.preventDefault();
                    if (historyIndex < history.length) {
                        historyIndex++;
                        if (historyIndex === history.length) {
                            cmd.value = draft;
                        } else {
                            cmd.value = history[historyIndex];
                        }
                        cmd.setSelectionRange(
                            cmd.value.length,
                            cmd.value.length,
                        );
                    }
                    return;
                }
            });

            document.addEventListener("keyup", (e) => {
                if (activeMode && activeMode.def.keyup)
                    activeMode.def.keyup(activeMode, e);
            });

            // Keep terminal clicks command-ready, but don't steal focus while
            // the user is selecting text to copy.
            terminal.addEventListener("click", () => {
                const selection = window.getSelection();
                if (selection && selection.toString()) return;
                cmd.focus();
            });

            // Touch quick-command chips: run without opening the keyboard.
            document
                .getElementById("quick-commands")
                .addEventListener("click", async (e) => {
                    const chip = e.target.closest("[data-cmd]");
                    if (!chip) return;
                    e.stopPropagation(); // skip the terminal's focus-the-input handler
                    if (activeMode) return;
                    const name = chip.dataset.cmd;
                    recordHistory(name);
                    historyIndex = history.length;
                    await runCommand(name);
                });

            // On-screen keyboards: size the page to the visible viewport so the
            // prompt stays above the keyboard (iOS Safari pans instead of resizing).
            if (window.visualViewport) {
                const syncViewport = () => {
                    const vv = window.visualViewport;
                    // Pinch-zoom also shrinks the visual viewport; ignore it.
                    if (vv.scale > 1.01) return;
                    document.documentElement.style.setProperty(
                        "--app-height",
                        `${Math.round(vv.height)}px`,
                    );
                    window.scrollTo(0, 0);
                    terminalScreen.scrollTop = terminalScreen.scrollHeight;
                };
                window.visualViewport.addEventListener("resize", syncViewport);
                syncViewport();
            }

            // boot text
            print("decyphered.tech");
            print("-------------");
            print("ready.");
            print("try: about, projects, film, values, site");
        </script>
    </body>
</html>
